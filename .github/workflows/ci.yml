name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e ./refassist
          pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m compileall -q refassist/src/refassist api

      - name: Unit tests (no network)
        env:
          PYTHONPATH: refassist/src
        run: pytest refassist/tests -q
