[project]
name = "refassist"
version = "0.8.0"
description = "Agentic IEEE Reference Pipeline (LangGraph) — modular, production-ready"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "cachetools>=5.3.3",
  "rapidfuzz>=3.9.7",
  "pydantic>=2.7.3",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.0",
  # RAG stack used by the LLM formatting node
  "langchain-openai>=0.1.7",
  "langchain-chroma>=0.1.0",
  "langchain-community>=0.2.0",
  "langchain-text-splitters>=0.2.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.35.10"]
anthropic = ["anthropic>=0.34.2"]
pdf = ["pdfminer.six>=20231228"]

[tool.setuptools.packages.find]
where = ["src"]
